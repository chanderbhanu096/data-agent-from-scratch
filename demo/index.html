<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Agent — Live Demo</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c232c; --line: #2b3440;
    --text: #e6edf3; --muted: #8b949e; --accent: #3fb950; --accent-dim: #235b32;
    --warn: #d29922; --bad: #f85149; --blue: #58a6ff; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }

  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
  header h1 .dim { color: var(--muted); font-weight: 400; }
  header p { margin: 0; color: var(--muted); max-width: 70ch; }

  .controls { margin: 22px 0 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .modes { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .mode { border: 0; background: transparent; color: var(--muted); padding: 7px 13px; border-radius: 7px;
    cursor: pointer; font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .mode[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .mode:disabled { opacity: .4; cursor: not-allowed; }
  .mode .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .mode:disabled .dot { background: var(--muted); }

  .qrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  select, input[type=text] { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 12px; font-size: 14px; }
  select { min-width: 260px; }
  input[type=text] { flex: 1 1 320px; }
  button.run { background: var(--accent); color: #06210e; border: 0; border-radius: 9px; padding: 10px 20px;
    font-size: 14px; font-weight: 700; cursor: pointer; }
  button.run:disabled { opacity: .5; cursor: not-allowed; }

  .hint { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .hint b { color: var(--warn); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .col .head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .chip-ch { display: inline-block; font: 700 11px/1 var(--mono); color: var(--accent); background: var(--accent-dim);
    padding: 4px 7px; border-radius: 6px; letter-spacing: .06em; }
  .col .title { font-weight: 700; margin: 8px 0 2px; }
  .col .subtitle { color: var(--muted); font-size: 12.5px; }
  .col .body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

  .answer { font-size: 15px; }
  .answer .ph { color: var(--muted); }
  .banner { font-size: 12.5px; border-radius: 8px; padding: 8px 10px; }
  .banner.fell { background: #26200c; color: var(--warn); border: 1px solid #4d3d12; }
  .banner.err { background: #2a1113; color: var(--bad); border: 1px solid #5c1e20; }

  pre.sql { margin: 0; background: #0b0f14; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    font: 12.5px/1.5 var(--mono); color: #c9d1d9; white-space: pre-wrap; word-break: break-word; }
  .sql-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }

  .receipt { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .r { font: 600 11.5px/1 var(--mono); color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
    padding: 5px 7px; border-radius: 6px; }
  .r.good { color: var(--accent); border-color: var(--accent-dim); }
  .r.bad { color: var(--bad); border-color: #5c1e20; }
  .r.warn { color: var(--warn); border-color: #4d3d12; }

  .shimmer { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--panel-2) 25%, #232c36 37%, var(--panel-2) 63%);
    background-size: 400% 100%; animation: sh 1.3s ease infinite; }
  @keyframes sh { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .running { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }

  footer { margin-top: 34px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Data Agent <span class="dim">— watch it get smarter, one chapter at a time</span></h1>
    <p>The same question, run through each chapter's real agent, side by side. These are genuine runs —
       the receipts under each answer are Chapter 12's tracing. Nothing here is faked.</p>
  </header>

  <div class="controls">
    <div class="modes" id="modes"></div>
    <span class="hint" id="modehint"></span>
  </div>

  <div class="qrow">
    <select id="qpick" aria-label="Example questions"></select>
    <input type="text" id="qinput" placeholder="…or type your own question about the taxi data" />
    <button class="run" id="runbtn">Run</button>
  </div>
  <div class="hint" id="status"></div>

  <div class="grid" id="grid"></div>

  <footer id="footer"></footer>
</div>

<script>
const state = { server: false, mode: "replay", modes: {}, questions: [], columns: [], runs: null };

async function init() {
  try {
    const cfg = await fetch("/api/config").then(r => { if (!r.ok) throw 0; return r.json(); });
    state.server = true;
    state.modes = cfg.modes; state.questions = cfg.questions; state.columns = cfg.columns;
  } catch {
    // No backend (static hosting) → replay-only from the captured file.
    const runs = await fetch("./data/runs.json").then(r => r.json()).catch(() => null);
    state.runs = runs || { questions: [], runs: {} };
    state.modes = { cloud: false, local: false, replay: (state.runs.questions || []).length > 0 };
    state.questions = state.runs.questions || [];
    state.columns = state.runs.columns || inferColumns(state.runs);
  }
  state.mode = state.modes.cloud ? "cloud" : (state.modes.local ? "local" : "replay");
  renderModes(); renderQuestions(); renderColumns(blankBodies());
  hintForMode();
  document.getElementById("footer").innerHTML =
    'Real runs, replayed — this is exactly what <b>Chapter 12 — Tracing</b> records. ' +
    '<a href="https://github.com/chanderbhanu096/data-agent-from-scratch" target="_blank" rel="noopener">See the code →</a>';
}

function inferColumns(runs) {
  const first = (runs.questions || [])[0];
  const cols = first ? (runs.runs[first] || []) : [];
  return cols.map(c => ({ id: c.id, chapter: c.chapter, title: c.title, subtitle: c.subtitle }));
}

const MODE_LABEL = { cloud: "Cloud (live)", local: "Local (live)", replay: "Replay" };
function renderModes() {
  const el = document.getElementById("modes");
  el.innerHTML = "";
  for (const m of ["cloud", "local", "replay"]) {
    const b = document.createElement("button");
    b.className = "mode"; b.dataset.mode = m;
    b.setAttribute("aria-pressed", String(state.mode === m));
    b.disabled = !state.modes[m];
    b.innerHTML = `<span class="dot"></span>${MODE_LABEL[m]}`;
    b.onclick = () => { state.mode = m; renderModes(); hintForMode(); };
    el.appendChild(b);
  }
}

function hintForMode() {
  const h = document.getElementById("modehint");
  if (state.mode === "cloud") h.innerHTML = "Real calls to a hosted frontier model.";
  else if (state.mode === "local") h.innerHTML = "Real calls to your local Ollama — offline, no key.";
  else h.innerHTML = "Playing back captured real runs — no model needed.";
  if (!state.modes.cloud && !state.modes.local)
    h.innerHTML += " <b>Live modes are off here — you are seeing recorded runs.</b>";
}

function renderQuestions() {
  const sel = document.getElementById("qpick");
  sel.innerHTML = "";
  for (const q of state.questions) {
    const o = document.createElement("option"); o.value = q; o.textContent = q; sel.appendChild(o);
  }
  sel.onchange = () => { document.getElementById("qinput").value = ""; };
}

function blankBodies() {
  return state.columns.map(c => ({ ...c, _state: "idle" }));
}

function renderColumns(cols) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const c of cols) grid.appendChild(colCard(c));
}

function colCard(c) {
  const el = document.createElement("div");
  el.className = "col"; el.id = "col-" + c.id;
  el.innerHTML = `
    <div class="head">
      <span class="chip-ch">CH ${c.chapter}</span>
      <div class="title">${esc(c.title)}</div>
      <div class="subtitle">${esc(c.subtitle)}</div>
    </div>
    <div class="body">${bodyHTML(c)}</div>`;
  return el;
}

function bodyHTML(c) {
  if (c._state === "idle")
    return `<div class="answer ph">Press Run to see this chapter's answer.</div>`;
  if (c._state === "loading")
    return `<div class="running"><span class="shimmer" style="width:120px"></span> running…</div>
            <div class="shimmer" style="width:90%"></div><div class="shimmer" style="width:70%"></div>`;
  if (c.error)
    return `<div class="banner err">⚠ ${esc(c.error)}</div>`;

  let html = "";
  if (c.fellback) html += `<div class="banner fell">↻ ${esc(c.note || "captured run")}</div>`;
  html += `<div class="answer">${esc(c.answer || "—")}</div>`;
  if (c.sql)
    html += `<div><div class="sql-label">SQL it wrote</div><pre class="sql">${esc(c.sql)}</pre></div>`;
  html += `<div class="receipt">${chips(c)}</div>`;
  return html;
}

function chips(c) {
  const steps = (c.steps || []).length;
  const g = c.grounded
    ? `<span class="r good">grounded ✓</span>`
    : `<span class="r bad">grounded ✗</span>`;
  const stop = c.stop_reason
    ? `<span class="r ${c.stop_reason === "answered" ? "" : "warn"}">${esc(c.stop_reason)}</span>` : "";
  const cost = (c.cost_usd || 0) > 0 ? `<span class="r">$${(c.cost_usd).toFixed(5)}</span>` : "";
  return [
    `<span class="r">${steps} step${steps === 1 ? "" : "s"}</span>`,
    `<span class="r">${c.tokens_in || 0}▸${c.tokens_out || 0} tok</span>`,
    cost, g, stop,
  ].filter(Boolean).join("");
}

async function getColumn(question, mode, columnId) {
  if (state.server) {
    return fetch("/api/column", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, mode, column: columnId }),
    }).then(r => r.json());
  }
  // Static replay: read from the captured file.
  const cols = (state.runs.runs || {})[question] || [];
  const found = cols.find(x => x.id === columnId);
  return found || { id: columnId, error: "no captured run for this question" };
}

async function run() {
  const q = (document.getElementById("qinput").value.trim()) || document.getElementById("qpick").value;
  if (!q) return;
  const btn = document.getElementById("runbtn"); btn.disabled = true;
  document.getElementById("status").textContent = `Running "${q}" — ${MODE_LABEL[state.mode]}`;

  const cols = state.columns.map(c => ({ ...c, _state: "loading" }));
  renderColumns(cols);

  // Fire every column in parallel — each fills in as its agent finishes.
  await Promise.all(state.columns.map(async (c, i) => {
    const payload = await getColumn(q, state.mode, c.id).catch(e => ({ id: c.id, error: String(e) }));
    cols[i] = { ...cols[i], ...payload, _state: "done" };
    document.getElementById("col-" + c.id).querySelector(".body").innerHTML = bodyHTML(cols[i]);
  }));

  document.getElementById("status").textContent = `Done — "${q}"`;
  btn.disabled = false;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

document.getElementById("runbtn").onclick = run;
document.getElementById("qinput").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
init();
</script>
</body>
</html>
