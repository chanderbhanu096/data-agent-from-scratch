<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Agent — Live Demo</title>
<style>
  :root {
    --bg: #fbfcfd; --panel: #ffffff; --panel-2: #f5f7f9; --line: #e2e7ec; --line-2: #eef1f4;
    --text: #17201a; --muted: #6b7681;
    --accent: #1a7f37; --accent-bg: #edf7f0; --accent-line: #c3e3cd;
    --warn: #9a6700; --warn-bg: #fdf8ea; --warn-line: #ecdda9;
    --bad: #b42318; --bad-bg: #fdf0ef; --bad-line: #f0c9c5;
    --blue: #0969da;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 56px 22px 72px; }

  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; font-weight: 700; }
  .sub { margin: 0 0 26px; color: var(--muted); font-size: 15px; }

  /* Ask */
  .ask { display: flex; gap: 8px; }
  input[type=text] { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 12px 14px; font-size: 15px; }
  input[type=text]::placeholder { color: #9aa4ae; }
  input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  button.run { background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 12px 20px;
    font-size: 15px; font-weight: 600; cursor: pointer; }
  button.run:hover { background: #176c30; }
  button.run:disabled { opacity: .45; cursor: not-allowed; }

  /* One quiet line: examples to click, and what's in the data */
  .hints { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    font-size: 12.5px; color: var(--muted); }
  .ex { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px;
    padding: 5px 11px; font-size: 12.5px; cursor: pointer; }
  .ex:hover { border-color: var(--accent); }
  .ex.trap { border-color: var(--warn-line); color: var(--warn); background: var(--warn-bg); }
  .datalink { margin-left: auto; white-space: nowrap; }

  /* Results — one compact row per agent, revealed top to bottom */
  .rows { margin-top: 26px; display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px;
    display: grid; grid-template-columns: 172px 1fr auto; gap: 16px; align-items: start;
    transition: border-color .18s, background .18s; }
  .row.active { border-color: var(--accent-line); background: var(--accent-bg); }
  @media (max-width: 720px) {
    .row { grid-template-columns: 1fr; gap: 8px; }
    .badges { justify-content: flex-start; }
  }

  .who .ch { font: 700 10.5px/1 var(--mono); color: var(--muted); letter-spacing: .06em; }
  .who .name { font-weight: 650; font-size: 14px; margin-top: 4px; display: block; color: var(--text); }
  .who a.name:hover { color: var(--blue); }
  .who .what { color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 3px; }

  .out { min-width: 0; }
  .out .answer { font-size: 14.5px; }
  .out .ph, .out .waiting { color: var(--muted); font-size: 13.5px; }
  .out .err { color: var(--bad); font-size: 13.5px; }
  .out .fell { color: var(--warn); font-size: 12.5px; margin-bottom: 4px; }

  details.sql { margin-top: 7px; }
  details.sql > summary { cursor: pointer; list-style: none; color: var(--muted); font-size: 11.5px;
    font-weight: 600; letter-spacing: .04em; display: inline-block; }
  details.sql > summary::-webkit-details-marker { display: none; }
  details.sql > summary:hover { color: var(--blue); }
  details.sql pre { margin: 7px 0 0; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 7px;
    padding: 9px 11px; font: 12px/1.5 var(--mono); color: #24292f; white-space: pre-wrap; word-break: break-word; }

  .badges { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .b { font: 600 11px/1 var(--mono); color: var(--muted); background: var(--panel-2); border: 1px solid var(--line-2);
    padding: 4px 7px; border-radius: 5px; white-space: nowrap; }
  .b.good { color: var(--accent); border-color: var(--accent-line); background: #e6f4ea; }
  .b.bad { color: var(--bad); border-color: var(--bad-line); background: var(--bad-bg); }
  .b.warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }

  .dot-anim { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    animation: pulse 1s ease-in-out infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  /* Footer: mode control + the rest of the repo, kept to two quiet lines */
  footer { margin-top: 30px; border-top: 1px solid var(--line-2); padding-top: 16px;
    color: var(--muted); font-size: 12.5px; }
  .modes { display: inline-flex; gap: 4px; margin-bottom: 10px; }
  .mode { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 5px 11px;
    border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .mode[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-bg); color: var(--accent); }
  .mode:disabled { opacity: .4; cursor: not-allowed; }
  footer p { margin: 0 0 7px; }
  footer .rest a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); }
  footer .rest a:hover { color: var(--blue); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ask NYC taxi data in plain English</h1>
  <p class="sub">The same question, answered by four versions of an AI agent built from scratch — so you can see which ones you can trust.</p>

  <div class="ask">
    <input type="text" id="qinput" placeholder="Ask about trips, tips, fares, zones or payment types…" />
    <button class="run" id="runbtn">Ask</button>
  </div>
  <div class="hints" id="hints"></div>

  <div class="rows" id="rows"></div>

  <footer>
    <div class="modes" id="modes"></div>
    <p id="modehint"></p>
    <p class="rest" id="rest"></p>
  </footer>
</div>

<script>
const state = { server: false, mode: "replay", modes: {}, examples: [], dataset: null, columns: [], chapters: [], runs: null };

async function init() {
  try {
    const cfg = await fetch("/api/config").then(r => { if (!r.ok) throw 0; return r.json(); });
    state.server = true;
    state.modes = cfg.modes; state.columns = cfg.columns;
    state.examples = cfg.examples || []; state.dataset = cfg.dataset || null; state.chapters = cfg.chapters || [];
  } catch {
    // No backend (static hosting) → everything from the captured file.
    const runs = await fetch("./data/runs.json").then(r => r.json()).catch(() => null);
    state.runs = runs || { questions: [], runs: {} };
    state.modes = { cloud: false, local: false, replay: (state.runs.questions || []).length > 0 };
    state.columns = state.runs.columns || [];
    state.examples = state.runs.examples || (state.runs.questions || []).map(q => ({ q }));
    state.dataset = state.runs.dataset || null;
    state.chapters = state.runs.chapters || [];
  }
  // Replay by default: instant and free. Live is one click away in the footer.
  state.mode = "replay";
  renderHints(); renderModes(); hintForMode(); renderRest();
  renderRows(state.columns.map(c => ({ ...c, _state: "idle" })));

  // Instant payoff: auto-run the trick question so the contrast is on screen at once.
  const trap = (state.examples.find(e => e.trap) || {}).q;
  if (trap && state.modes.replay) { document.getElementById("qinput").value = trap; run(trap); }
}

function renderHints() {
  const el = document.getElementById("hints");
  el.innerHTML = "";
  // Two ordinary questions plus the trap — the trap is the point, so it always shows.
  const trap = state.examples.filter(e => e.trap);
  const picks = [...state.examples.filter(e => !e.trap).slice(0, 2), ...trap];
  for (const ex of picks) {
    const b = document.createElement("button");
    b.className = "ex" + (ex.trap ? " trap" : "");
    b.textContent = (ex.trap ? "⚠ " : "") + ex.q;
    if (ex.note) b.title = ex.note;
    b.onclick = () => { document.getElementById("qinput").value = ex.q; run(ex.q); };
    el.appendChild(b);
  }
  const d = state.dataset;
  if (d) {
    const tables = d.tables.map(t => `${t.name} (${t.rows})`).join(", ");
    const a = document.createElement("a");
    a.className = "datalink"; a.href = d.explore || "#"; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "what's in the data →";
    a.title = `${d.name} — ${tables}`;
    el.appendChild(a);
  }
}

function renderRows(cols) {
  const el = document.getElementById("rows");
  el.innerHTML = "";
  for (const c of cols) el.appendChild(rowEl(c));
}

function rowEl(c) {
  const el = document.createElement("div");
  el.className = "row"; el.id = "row-" + c.id;
  const name = c.link
    ? `<a class="name" href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.title)}</a>`
    : `<span class="name">${esc(c.title)}</span>`;
  el.innerHTML = `
    <div class="who"><span class="ch">CH ${esc(c.chapter)}</span>${name}
      <div class="what">${esc(c.plain || "")}</div></div>
    <div class="out">${outHTML(c)}</div>
    <div class="badges">${badges(c)}</div>`;
  return el;
}

function outHTML(c) {
  if (c._state === "idle") return `<div class="ph">Ask a question above.</div>`;
  if (c._state === "queued") return `<div class="waiting">waiting…</div>`;
  if (c._state === "loading") return `<div class="waiting"><span class="dot-anim"></span>thinking…</div>`;
  if (c.error) return `<div class="err">${esc(c.error)}</div>`;

  let html = "";
  // Only flag a fallback when a *live* mode fell back — in Replay it's expected.
  if (c.fellback && state.mode !== "replay") html += `<div class="fell">↻ ${esc(c.note || "captured run")}</div>`;
  html += `<div class="answer">${esc(c.answer || "—")}</div>`;
  if (c.sql)
    html += `<details class="sql"><summary>show the SQL it wrote</summary><pre>${esc(c.sql)}</pre></details>`;
  return html;
}

function badges(c) {
  if (!c._state || c._state !== "done" || c.error) return "";
  const steps = (c.steps || []).length;
  const out = [];
  out.push(c.grounded
    ? `<span class="b good" title="the answer came from real query results, not guessed">grounded ✓</span>`
    : `<span class="b bad" title="not backed by query results">grounded ✗</span>`);
  if (c.stop_reason && c.stop_reason !== "answered")
    out.push(`<span class="b warn" title="how the run ended">${esc(c.stop_reason.split("—")[0].trim())}</span>`);
  out.push(`<span class="b" title="tool-calling steps this run took">${steps} step${steps === 1 ? "" : "s"}</span>`);
  if ((c.cost_usd || 0) > 0) out.push(`<span class="b" title="what this run actually cost">$${c.cost_usd.toFixed(4)}</span>`);
  return out.join("");
}

const MODE_LABEL = { cloud: "Run live", local: "Local model", replay: "Recorded" };
function renderModes() {
  const el = document.getElementById("modes");
  el.innerHTML = "";
  for (const m of ["replay", "cloud", "local"]) {
    if (!state.modes[m] && m === "local") continue;   // never show a pill that can't work
    const b = document.createElement("button");
    b.className = "mode";
    b.setAttribute("aria-pressed", String(state.mode === m));
    b.disabled = !state.modes[m];
    b.textContent = MODE_LABEL[m];
    b.onclick = () => { state.mode = m; renderModes(); hintForMode(); };
    el.appendChild(b);
  }
}

function hintForMode() {
  const h = document.getElementById("modehint");
  if (state.mode === "cloud") h.textContent = "Live — your question goes to a real model, and the agents run for real.";
  else if (state.mode === "local") h.textContent = "Live against your local Ollama — offline, no API key.";
  else h.textContent = state.modes.cloud
    ? "Showing recorded real runs (instant, free). Switch to Run live to ask anything you like."
    : "Showing recorded real runs — captured from the actual agents, no model needed here.";
}

function renderRest() {
  const el = document.getElementById("rest");
  const shown = new Set(state.columns.map(c => c.id));
  const rest = state.chapters.filter(c => !shown.has("ch" + c.n));
  if (!rest.length) { el.style.display = "none"; return; }
  const links = rest.map(c =>
    `<a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.title)}</a>`).join(" · ");
  el.innerHTML = `The four above are chapters you can run here. The rest of the build: ${links}.`;
}

async function getColumn(question, mode, columnId) {
  if (state.server) {
    return fetch("/api/column", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, mode, column: columnId }),
    }).then(r => r.json());
  }
  const cols = (state.runs.runs || {})[question] || [];
  return cols.find(x => x.id === columnId)
    || { id: columnId, error: "no recorded run for this one — switch to Run live to ask it" };
}

function setRow(c) {
  const el = document.getElementById("row-" + c.id);
  el.querySelector(".out").innerHTML = outHTML(c);
  el.querySelector(".badges").innerHTML = badges(c);
  el.classList.toggle("active", c._state === "loading");
}

async function run(qOverride) {
  const q = (qOverride != null ? qOverride : document.getElementById("qinput").value.trim());
  if (!q) return;
  const btn = document.getElementById("runbtn"); btn.disabled = true;

  // One by one, top to bottom — you watch the answer change across chapters.
  const cols = state.columns.map(c => ({ ...c, _state: "queued" }));
  renderRows(cols);

  for (let i = 0; i < state.columns.length; i++) {
    const c = state.columns[i];
    cols[i] = { ...cols[i], _state: "loading" }; setRow(cols[i]);
    const payload = await getColumn(q, state.mode, c.id).catch(e => ({ id: c.id, error: String(e) }));
    cols[i] = { ...cols[i], ...payload, _state: "done" }; setRow(cols[i]);
  }
  btn.disabled = false;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

document.getElementById("runbtn").onclick = () => run();
document.getElementById("qinput").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
init();
</script>
</body>
</html>
