<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Agent — Live Demo</title>
<style>
  :root {
    --bg: #f6f8fb; --panel: #ffffff; --panel-2: #f2f5f8; --line: #d6dde4; --line-soft: #e7ecf1;
    --text: #1f2328; --muted: #59636e;
    --accent: #1a7f37; --accent-bg: #e8f6ec; --accent-line: #b7e0c2;
    --warn: #9a6700; --warn-bg: #fff8e6; --warn-line: #ecdba6;
    --bad: #cf222e; --bad-bg: #fdeceb; --bad-line: #f2c4c2;
    --blue: #0969da; --purple: #6639ba;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(27,31,36,.05), 0 1px 3px rgba(27,31,36,.04);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 22px 72px; }

  header h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; font-weight: 700; }
  header p { margin: 0; color: var(--muted); max-width: 72ch; font-size: 15px; }
  header p b { color: var(--text); font-weight: 600; }

  /* One compact line: what's in the warehouse + a link to go look at it */
  .dataset { margin: 22px 0 0; display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .ds-tag { font: 700 10px/1 var(--mono); letter-spacing: .09em; color: var(--blue); background: #ddf1ff;
    border: 1px solid #b8def8; padding: 4px 6px; border-radius: 5px; }
  .ds-name { color: var(--text); font-weight: 600; }
  .ds-tbls { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .ds-tbl { font: 600 12px/1 var(--mono); color: var(--text); background: var(--panel);
    border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; }
  .ds-tbl i { color: var(--muted); font-style: normal; font-weight: 400; margin-left: 5px; }
  .ds-explore { margin-left: auto; font-size: 12.5px; font-weight: 600; white-space: nowrap; }

  /* Ask row */
  .ask { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text] { flex: 1 1 340px; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; font-size: 15px; box-shadow: var(--shadow); }
  input[type=text]::placeholder { color: #98a2ad; }
  input[type=text]:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px #ddeeff; }
  button.run { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px;
    font-size: 15px; font-weight: 600; cursor: pointer; }
  button.run:hover { background: #176c30; }
  button.run:disabled { opacity: .5; cursor: not-allowed; }

  .examples { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .examples .lbl { color: var(--muted); font-size: 12.5px; margin-right: 2px; }
  .ex { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px;
    padding: 7px 13px; font-size: 12.5px; cursor: pointer; }
  .ex:hover { border-color: var(--blue); }
  .ex.trap { border-color: var(--warn-line); color: var(--warn); background: var(--warn-bg); }
  .ex.trap:hover { border-color: var(--warn); }

  /* Modes */
  .moderow { margin-top: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .modes { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 3px; box-shadow: var(--shadow); }
  .mode { border: 0; background: transparent; color: var(--muted); padding: 7px 13px; border-radius: 7px;
    cursor: pointer; font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .mode[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .mode:disabled { opacity: .45; cursor: not-allowed; }
  .mode .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .mode:disabled .dot { background: var(--muted); }
  .modehint { color: var(--muted); font-size: 12.5px; }
  .modehint b { color: var(--warn); font-weight: 600; }

  .status { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 18px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 14px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: var(--shadow); transition: box-shadow .2s, border-color .2s; }
  .col.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .col .head { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  .chip-ch { display: inline-block; font: 700 11px/1 var(--mono); color: var(--accent); background: var(--accent-bg);
    border: 1px solid var(--accent-line); padding: 4px 7px; border-radius: 6px; letter-spacing: .05em; }
  .chip-ch:hover { text-decoration: none; background: #daf1e1; }
  .col .title { font-weight: 700; margin: 8px 0 3px; }
  .col .plain { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .col .body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

  .answer { font-size: 15px; }
  .answer .ph { color: var(--muted); }
  .banner { font-size: 12.5px; border-radius: 8px; padding: 8px 10px; }
  .banner.fell { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
  .banner.err { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-line); }

  pre.sql { margin: 0; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 10px 12px; font: 12.5px/1.5 var(--mono); color: #24292f; white-space: pre-wrap; word-break: break-word; }
  .sql-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }

  .receipt { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .r { font: 600 11.5px/1 var(--mono); color: var(--muted); background: var(--panel-2); border: 1px solid var(--line-soft);
    padding: 5px 7px; border-radius: 6px; }
  .r.good { color: var(--accent); border-color: var(--accent-line); background: var(--accent-bg); }
  .r.bad { color: var(--bad); border-color: var(--bad-line); background: var(--bad-bg); }
  .r.warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }

  .legend { margin-top: 12px; color: var(--muted); font-size: 12px; }
  .legend b { color: var(--text); font-weight: 600; }

  .shimmer { height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, var(--panel-2) 25%, #e9edf1 37%, var(--panel-2) 63%);
    background-size: 400% 100%; animation: sh 1.3s ease infinite; }
  @keyframes sh { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .running { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .queued { color: var(--muted); font-size: 13px; }

  /* The full curriculum — the other chapters, one click each, not run live */
  .chapters { margin-top: 34px; border-top: 1px solid var(--line-soft); padding-top: 20px; }
  .ch-h { font-size: 13px; color: var(--text); font-weight: 600; margin-bottom: 12px; }
  .ch-note { color: var(--muted); font-weight: 400; }
  .ch-grid { display: flex; flex-wrap: wrap; gap: 7px; }
  .ch { display: inline-flex; align-items: baseline; gap: 6px; font-size: 12.5px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; box-shadow: var(--shadow); }
  .ch:hover { border-color: var(--blue); text-decoration: none; }
  .ch b { font: 700 11px/1 var(--mono); color: var(--muted); }
  .ch.live { border-color: var(--accent-line); background: var(--accent-bg); }
  .ch.live b { color: var(--accent); }

  footer { margin-top: 30px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line-soft); padding-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ask NYC taxi data in plain English</h1>
    <p>Type a question. <b>Three versions of the same from-scratch AI agent</b> answer it, one after
       another — and you see which ones you can trust. Every run is real; the badges under each answer
       are the agent's own trace.</p>
  </header>

  <div class="dataset" id="dataset"></div>

  <div class="ask">
    <input type="text" id="qinput" placeholder="e.g. average tip by payment type — ask about tips, fares, zones, boroughs, payment types…" />
    <button class="run" id="runbtn">Run</button>
  </div>
  <div class="examples" id="examples"></div>

  <div class="moderow">
    <div class="modes" id="modes"></div>
    <span class="modehint" id="modehint"></span>
  </div>
  <div class="status" id="status"></div>

  <div class="grid" id="grid"></div>
  <div class="legend" id="legend"></div>

  <section class="chapters" id="chapters"></section>

  <footer id="footer"></footer>
</div>

<script>
const state = { server: false, mode: "replay", modes: {}, questions: [], examples: [], dataset: null, columns: [], chapters: [], runs: null };

async function init() {
  try {
    const cfg = await fetch("/api/config").then(r => { if (!r.ok) throw 0; return r.json(); });
    state.server = true;
    state.modes = cfg.modes; state.questions = cfg.questions; state.columns = cfg.columns;
    state.examples = cfg.examples || []; state.dataset = cfg.dataset || null; state.chapters = cfg.chapters || [];
  } catch {
    // No backend (static hosting) → everything from the captured file.
    const runs = await fetch("./data/runs.json").then(r => r.json()).catch(() => null);
    state.runs = runs || { questions: [], runs: {} };
    state.modes = { cloud: false, local: false, replay: (state.runs.questions || []).length > 0 };
    state.questions = state.runs.questions || [];
    state.columns = state.runs.columns || [];
    state.examples = state.runs.examples || (state.questions.map(q => ({ q })));
    state.dataset = state.runs.dataset || null;
    state.chapters = state.runs.chapters || [];
  }
  // Default to replay: it paints instantly and costs nothing. Live is one click away.
  state.mode = "replay";
  renderDataset(); renderExamples(); renderModes(); hintForMode(); renderLegend(); renderChapters();
  renderColumns(state.columns.map(c => ({ ...c, _state: "idle" })));
  document.getElementById("footer").innerHTML =
    'Built from scratch, one Python file at a time. ' +
    '<a href="https://github.com/chanderbhanu096/data-agent-from-scratch" target="_blank" rel="noopener">Read the code →</a>';

  // Instant payoff: auto-run the trick question so the contrast is on screen immediately.
  const trap = (state.examples.find(e => e.trap) || {}).q;
  if (trap && state.modes.replay) { document.getElementById("qinput").value = trap; run(trap); }
}

function renderDataset() {
  const d = state.dataset, el = document.getElementById("dataset");
  if (!d) { el.style.display = "none"; return; }
  const tbls = d.tables.map(t => `<span class="ds-tbl">${esc(t.name)}<i>${esc(t.rows)}</i></span>`).join("");
  const link = d.explore
    ? `<a class="ds-explore" href="${esc(d.explore)}" target="_blank" rel="noopener">explore the data →</a>` : "";
  el.innerHTML =
    `<span class="ds-tag">DATA</span><span class="ds-name">${esc(d.name)}</span>
     <span class="ds-tbls">${tbls}</span>${link}`;
}

function renderExamples() {
  const el = document.getElementById("examples");
  el.innerHTML = `<span class="lbl">Try:</span>`;
  for (const ex of state.examples) {
    const b = document.createElement("button");
    b.className = "ex" + (ex.trap ? " trap" : "");
    b.textContent = (ex.trap ? "⚠ " : "") + ex.q;
    if (ex.note) b.title = ex.note;
    b.onclick = () => { document.getElementById("qinput").value = ex.q; run(ex.q); };
    el.appendChild(b);
  }
}

const MODE_LABEL = { cloud: "Cloud (live)", local: "Local (live)", replay: "Replay" };
function renderModes() {
  const el = document.getElementById("modes");
  el.innerHTML = "";
  for (const m of ["cloud", "local", "replay"]) {
    const b = document.createElement("button");
    b.className = "mode"; b.dataset.mode = m;
    b.setAttribute("aria-pressed", String(state.mode === m));
    b.disabled = !state.modes[m];
    b.innerHTML = `<span class="dot"></span>${MODE_LABEL[m]}`;
    b.onclick = () => { state.mode = m; renderModes(); hintForMode(); };
    el.appendChild(b);
  }
}

function hintForMode() {
  const h = document.getElementById("modehint");
  if (state.mode === "cloud") h.innerHTML = "Real calls to a hosted frontier model.";
  else if (state.mode === "local") h.innerHTML = "Real calls to your local Ollama — offline, no key.";
  else if (state.modes.cloud || state.modes.local)
    h.innerHTML = "Recorded runs (instant). <b>Click Cloud (live) to run your own question for real.</b>";
  else h.innerHTML = "Playing back captured real runs — no model needed here.";
}

function renderLegend() {
  document.getElementById("legend").innerHTML =
    '<b>grounded</b> = the answer came from real query results, not guessed &nbsp;·&nbsp; ' +
    '<b>steps / tokens / $</b> = what that run actually used. Lower isn\'t always better — the careful agent spends more to be right.';
}

function renderChapters() {
  const el = document.getElementById("chapters");
  if (!state.chapters.length) { el.style.display = "none"; return; }
  const chips = state.chapters.map(c =>
    `<a class="ch${c.live ? " live" : ""}" href="${esc(c.link)}" target="_blank" rel="noopener"
        title="${esc(c.title)}"><b>${esc(c.n)}</b>${esc(c.title)}</a>`).join("");
  el.innerHTML =
    `<div class="ch-h">The full build — 16 chapters.
       <span class="ch-note">The three highlighted run above; the rest are one click to the code.</span></div>
     <div class="ch-grid">${chips}</div>`;
}

function renderColumns(cols) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const c of cols) grid.appendChild(colCard(c));
}

function colCard(c) {
  const el = document.createElement("div");
  el.className = "col"; el.id = "col-" + c.id;
  const chip = c.link
    ? `<a class="chip-ch" href="${esc(c.link)}" target="_blank" rel="noopener">CH ${esc(c.chapter)} ↗</a>`
    : `<span class="chip-ch">CH ${esc(c.chapter)}</span>`;
  el.innerHTML = `
    <div class="head">${chip}
      <div class="title">${esc(c.title)}</div>
      <div class="plain">${esc(c.plain || c.subtitle || "")}</div>
    </div>
    <div class="body">${bodyHTML(c)}</div>`;
  return el;
}

function bodyHTML(c) {
  if (c._state === "idle")
    return `<div class="answer ph">Press Run to see this version's answer.</div>`;
  if (c._state === "queued")
    return `<div class="queued">waiting…</div>`;
  if (c._state === "loading")
    return `<div class="running"><span class="shimmer" style="width:110px"></span> thinking…</div>
            <div class="shimmer" style="width:90%"></div><div class="shimmer" style="width:70%"></div>`;
  if (c.error)
    return `<div class="banner err">⚠ ${esc(c.error)}</div>`;

  let html = "";
  // Only flag a fallback when a *live* mode fell back — in Replay it's expected, not a surprise.
  if (c.fellback && state.mode !== "replay") html += `<div class="banner fell">↻ ${esc(c.note || "captured run")}</div>`;
  html += `<div class="answer">${esc(c.answer || "—")}</div>`;
  if (c.sql)
    html += `<div><div class="sql-label">SQL it wrote</div><pre class="sql">${esc(c.sql)}</pre></div>`;
  html += `<div class="receipt">${chips(c)}</div>`;
  return html;
}

function chips(c) {
  const steps = (c.steps || []).length;
  const g = c.grounded
    ? `<span class="r good">grounded ✓</span>`
    : `<span class="r bad">grounded ✗</span>`;
  const stop = c.stop_reason
    ? `<span class="r ${c.stop_reason === "answered" ? "" : "warn"}">${esc(c.stop_reason)}</span>` : "";
  const cost = (c.cost_usd || 0) > 0 ? `<span class="r">$${(c.cost_usd).toFixed(5)}</span>` : "";
  return [
    `<span class="r">${steps} step${steps === 1 ? "" : "s"}</span>`,
    `<span class="r">${c.tokens_in || 0}▸${c.tokens_out || 0} tok</span>`,
    cost, g, stop,
  ].filter(Boolean).join("");
}

async function getColumn(question, mode, columnId) {
  if (state.server) {
    return fetch("/api/column", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, mode, column: columnId }),
    }).then(r => r.json());
  }
  const cols = (state.runs.runs || {})[question] || [];
  const found = cols.find(x => x.id === columnId);
  return found || { id: columnId, error: "no recorded run for this question — switch to a live mode to ask it" };
}

function setBody(id, c) { document.getElementById("col-" + id).querySelector(".body").innerHTML = bodyHTML(c); }
function setActive(id, on) { document.getElementById("col-" + id).classList.toggle("active", on); }

async function run(qOverride) {
  const q = (qOverride != null ? qOverride : document.getElementById("qinput").value.trim());
  if (!q) return;
  const btn = document.getElementById("runbtn"); btn.disabled = true;

  // Reveal one by one — you watch the answer improve across versions.
  const cols = state.columns.map(c => ({ ...c, _state: "queued" }));
  renderColumns(cols);

  for (let i = 0; i < state.columns.length; i++) {
    const c = state.columns[i];
    cols[i] = { ...cols[i], _state: "loading" };
    setActive(c.id, true); setBody(c.id, cols[i]);
    document.getElementById("status").textContent = `“${q}” — ${MODE_LABEL[state.mode]} · running ${c.title}…`;
    const payload = await getColumn(q, state.mode, c.id).catch(e => ({ id: c.id, error: String(e) }));
    cols[i] = { ...cols[i], ...payload, _state: "done" };
    setActive(c.id, false); setBody(c.id, cols[i]);
  }
  document.getElementById("status").textContent = `Done — “${q}”. Try another, or edit it above.`;
  btn.disabled = false;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

document.getElementById("runbtn").onclick = () => run();
document.getElementById("qinput").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
init();
</script>
</body>
</html>
