[project]
name = "data-agent-from-scratch"
version = "0.1.0"
description = "Build a production text-to-SQL data agent from scratch. No frameworks, no black boxes."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = ["anthropic>=0.40", "openai>=1.50", "pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataagent"]

[tool.pytest.ini_options]
testpaths = ["tests", "chapters"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
